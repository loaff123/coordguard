name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - run: python -m unittest discover -v
      - run: python -m scripts.stress_oracles
  netcdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[netcdf]'
      - run: python -m unittest discover -v
      - run: python -m examples.netcdf_generate /tmp/coordguard-examples
      - run: python -m coordguard audit-nc /tmp/coordguard-examples/near-left.nc /tmp/coordguard-examples/near-left.nc --left-variable temperature --right-variable temperature > /tmp/report.json
      - run: python -m coordguard verify-report /tmp/report.json --left /tmp/coordguard-examples/near-left.nc --right /tmp/coordguard-examples/near-left.nc
